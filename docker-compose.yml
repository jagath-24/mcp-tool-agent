services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mcpdb
    ports:
      - "3308:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  mcp-server:
    build: ./mcp-server
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: mcpdb
      DB_USER: mcp_readonly
      DB_PASSWORD: readonly123
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  agent-backend:
    build: ./agent-backend
    environment:
      MCP_SERVER_URL: http://mcp-server:8081
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: openai/gpt-oss-120b
    ports:
      - "8080:8080"
    depends_on:
      mcp-server:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - agent-backend

volumes:
  mysql-data:
