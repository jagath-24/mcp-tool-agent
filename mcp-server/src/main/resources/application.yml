server:
  port: 8081

spring:
  application:
    name: mcp-server

  ai:
    mcp:
      server:
        name: local-tools-server
        version: 1.0.0
        type: SYNC
        instructions: >
          Tools for querying a MySQL database (read-only), searching local
          documents by keyword, and fetching current weather for a city.

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mcpdb}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:mcp_readonly}
    password: ${DB_PASSWORD:readonly123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      read-only: true

logging:
  level:
    com.jagath.mcpserver: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
