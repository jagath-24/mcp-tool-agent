server:
  port: 8080

spring:
  application:
    name: agent-backend

mcp:
  server:
    url: ${MCP_SERVER_URL:http://localhost:8081}

groq:
  api-key: ${GROQ_API_KEY:}
  base-url: https://api.groq.com/openai/v1
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}
  max-tool-iterations: 5

logging:
  level:
    com.jagath.agent: DEBUG
